[package]
name = "gemini-rag"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
axum = "0.8.6"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
futures-util = "0.3.31"
mime_guess = "2.0.5"
reqwest = { version = "0.12.24", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "time"] }
walkdir = "2.5.0"
