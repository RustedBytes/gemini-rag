[package]
name = "gemini-rag"
version = "0.3.0"
edition = "2024"
authors = ["Yehor Smoliakov <egorsmkv@gmail.com>"]
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.5", features = ["derive", "env"] }
dotenvy = "0.15.7"
env_logger = "0.11.11"
futures-util = "0.3.33"
log = "0.4.33"
mime_guess = "2.0.5"
reqwest = { version = "0.13.4", features = ["json", "query", "rustls", "stream"], default-features = false }
rmcp = { version = "3.1.0", features = ["transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "time"] }
walkdir = "2.5.0"
