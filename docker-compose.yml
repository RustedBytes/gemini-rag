version: "3.8"

services:
  openai-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: gemini-rag-openai-server:latest
    ports:
      - "${OPENAI_SERVER_PORT:-8080}:8080"
    environment:
      GEMINI_API_KEY: "${GEMINI_API_KEY:?set GEMINI_API_KEY}"
      GEMINI_FILE_SEARCH_STORE: "${GEMINI_FILE_SEARCH_STORE:?set GEMINI_FILE_SEARCH_STORE}"
      GEMINI_PROXY_MODEL: "${GEMINI_PROXY_MODEL:-gemini-3-flash-preview}"
      GEMINI_SYSTEM_PROMPT_FILE: "${GEMINI_SYSTEM_PROMPT_FILE:-}"
      GEMINI_BASE_URL: "${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}"
      GEMINI_RAG_BIND: "0.0.0.0:8080"
      GEMINI_RAG_LOG: "/data/gemini-rag.log"
    volumes:
      - gemini-rag-data:/data
    restart: unless-stopped

volumes:
  gemini-rag-data:
